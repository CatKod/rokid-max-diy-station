name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore RokidDiyStation.sln

      - name: Build
        run: dotnet build RokidDiyStation.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test RokidDiyStation.sln --configuration Release --no-build --verbosity normal
        continue-on-error: true   # tests come online in later milestones
